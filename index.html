<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Validada</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; margin: 0; }
        .calc-box { background: #1e1e1e; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 300px; }
        #visor { width: 100%; height: 60px; margin-bottom: 20px; border: none; border-radius: 10px; text-align: right; padding: 15px; font-size: 1.8rem; box-sizing: border-box; background: #2d2d2d; color: #00ff88; outline: none; }
        .teclado { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { height: 60px; border: none; border-radius: 12px; font-size: 1.2rem; cursor: pointer; background: #333; color: white; transition: 0.2s; }
        button:hover { background: #444; }
        .op { background: #ff9500; color: white; }
        .op:hover { background: #ffaa33; }
        .igual { background: #00ff88; color: #121212; grid-column: span 2; font-weight: bold; }
        .limpar { background: #ff3b30; color: white; grid-column: span 2; }
    </style>
</head>
<body>

<div class="calc-box">
    <input type="text" id="visor" placeholder="0" readonly>
    
    <div class="teclado">
        <button class="limpar" onclick="limpar()">C</button>
        <button class="op" onclick="addOp('%')">%</button>
        <button class="op" onclick="addOp('/')">/</button>
        
        <button onclick="addNum('7')">7</button>
        <button onclick="addNum('8')">8</button>
        <button onclick="addNum('9')">9</button>
        <button class="op" onclick="addOp('*')">×</button>
        
        <button onclick="addNum('4')">4</button>
        <button onclick="addNum('5')">5</button>
        <button onclick="addNum('6')">6</button>
        <button class="op" onclick="addOp('-')">-</button>
        
        <button onclick="addNum('1')">1</button>
        <button onclick="addNum('2')">2</button>
        <button onclick="addNum('3')">3</button>
        <button class="op" onclick="addOp('+')">+</button>
        
        <button onclick="addNum('0')">0</button>
        <button onclick="addNum('.')">.</button>
        <button class="igual" onclick="calcular()">=</button>
    </div>
</div>

<script>
    const visor = document.getElementById('visor');

    function addNum(num) {
        visor.value += num;
    }

    function addOp(op) {
        const atual = visor.value;
        const ultimoChar = atual.slice(-1);
        const operadores = ['+', '-', '*', '/', '%'];

        // REGRA DE SEGURANÇA:
        // Se o visor estiver vazio, só permitimos o "-" para números negativos.
        // Qualquer outro sinal (+, *, /, %) será ignorado.
        if (atual === "") {
            if (op === "-") {
                visor.value = op;
            }
            return; 
        }

        // REGRA DE SINAL SOLITÁRIO:
        // Se o visor tiver apenas um "-", não permite colocar outro operador logo depois.
        if (atual === "-" && operadores.includes(op)) {
            return;
        }

        // EVITA DUPLICADOS: Substitui o sinal anterior pelo novo se clicado seguidamente
        if (operadores.includes(ultimoChar)) {
            visor.value = atual.slice(0, -1) + op;
        } else {
            visor.value += op;
        }
    }

    function limpar() {
        visor.value = "";
    }

    function calcular() {
        const atual = visor.value;
        const operadores = ['+', '-', '*', '/', '%'];

        // Se o visor estiver vazio ou contiver apenas um sinal de menos, não faz nada
        if (atual === "" || atual === "-") return;

        try {
            // Substitui % por /100 para o cálculo
            let expressao = atual.replace(/%/g, '/100');
            let resultado = eval(expressao);
            
            // Arredonda para evitar erros de precisão decimal
            visor.value = Number(resultado.toFixed(8));
        } catch (e) {
            visor.value = "Erro";
            setTimeout(limpar, 1500);
        }
    }
</script>

</body>
</html>
